# Pull-request and main-branch checks for Quota.
#
# Every `uses:` below is pinned to a full 40-character commit SHA. A tag or a
# branch can be moved by its owner, so a pinned SHA is the only form that makes
# an action's code immutable. The comment above each pin names the action and
# the release the SHA came from, so an update is a deliberate edit.
#
# No `run:` step interpolates event text. Titles, branch names, and issue bodies
# are attacker-controlled on a pull request; putting them in a shell command
# turns a data value into executed code. Steps read repository files only.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# The default token permission is read-only. Nothing in this workflow needs to
# write to the repository, and none of these steps needs a secret.
permissions:
  contents: read

# A new push to the same branch makes the previous run pointless. Cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        # Every Rust package, the lockfile, and the Cargo configuration live in
        # the Cargo workspace under src-tauri.
        working-directory: src-tauri
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Tauri on Linux builds against the system WebView, not a bundled engine.
      # Without these development packages the `quota-desktop` package cannot
      # compile. Install them explicitly so a clean runner also compiles the
      # host permission manifest and capabilities.
      - name: Install the Tauri system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget
          pkg-config --exists webkit2gtk-4.1

      # src-tauri/rust-toolchain.toml pins the compiler, and rustup installs it and the
      # listed components on first use. No CI step repeats the version, so the
      # toolchain cannot drift between the file and this workflow.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      # Named on its own so a failure says which package broke. `cargo clippy`
      # and `cargo test` below also cover it, but only after every other package
      # has built, which hides the real cause behind a wall of output.
      - name: Desktop host compiles
        run: cargo build --locked -p quota-desktop

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Architecture gate
        run: cargo xtask check-architecture

      - name: Release gate
        run: cargo xtask check-release

      - name: Generated binding drift
        run: cargo xtask bindings --check

  # The `rust` job runs on Linux, so an adapter that breaks only on Windows
  # would pass CI untouched. quota-providers depends on ring 0.17.14, which
  # compiles C, so a Linux cross-check with --target x86_64-pc-windows-gnu
  # fails for lack of x86_64-w64-mingw32-gcc. On a Windows runner MSVC and
  # the Windows SDK are already present, so this job checks the native
  # target.
  #
  # The macOS adapter cannot be checked from any runner in this workflow: a
  # Linux runner has no Apple C compiler and no macOS SDK, and a Windows
  # runner has neither. The macOS PATH logic still compiles on the Linux
  # runner, because the platform module compiles all of windows.rs, linux.rs,
  # macos.rs and unsupported.rs on every host; the macOS credential-store
  # constructor is the part no runner here can typecheck.
  windows:
    name: Windows adapter
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # src-tauri/rust-toolchain.toml pins the compiler, and rustup installs it and the
      # listed components on first use. No CI step repeats the version, so the
      # toolchain cannot drift between the file and this workflow.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Adapter compiles for Windows
        run: cargo check --locked -p quota-providers --all-targets

      - name: Clippy
        run: cargo clippy --locked -p quota-providers --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked -p quota-providers

      - name: Format
        run: cargo fmt --all -- --check

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        # The Tauri application is at the repository root, as the official
        # project structure prescribes.
        working-directory: .
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # oven-sh/setup-bun v2. The version is read from .bun-version, so the
      # file is the single place the Bun release is pinned.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun run test

      - name: Build and exclude inspection from the renderer
        run: bun run check:release:renderer

  # The interface tests run the real built renderer in headless Chromium with the
  # Tauri backend faked at the IPC boundary (see CONTRIBUTING.md, "Interface
  # tests"). This job lives in this workflow on purpose: the release workflow
  # accepts a commit only when this workflow's run succeeded, so a failure here
  # blocks a release exactly as a failing unit test does. Do not move it to its
  # own workflow file.
  interface:
    name: Interface tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # oven-sh/setup-bun v2. The version is read from .bun-version.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      # actions/cache v6.1.0. The browser build is keyed on the lockfile, which
      # pins the Playwright version and so the Chromium revision it downloads.
      - name: Cache the Playwright browser
        id: playwright-browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Download Chromium
        if: steps.playwright-browser.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      # The system libraries Chromium needs are not part of the browser cache.
      - name: Install Chromium system libraries
        run: bunx playwright install-deps chromium

      - name: Interface tests
        run: bun run test:ui

      # actions/upload-artifact v7.0.1. Screenshots are always kept, so a
      # reviewer can look at every state; the report and traces explain a failure.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: interface-test-results
          path: |
            test-results/screenshots
            test-results/ui
            playwright-report
          if-no-files-found: warn
          retention-days: 14

  # The Linux real-app job builds the actual desktop application, starts it
  # under a virtual display, and drives it through Tauri's official WebDriver
  # server. The Windows job below drives the same suite through Edge WebDriver.
  # Both jobs stay in this workflow so a failure blocks a release.

  real-app:
    name: Real app (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The Tauri build dependencies are the Rust job's, plus a virtual display
      # (xvfb) and WebKitGTK's WebDriver, which tauri-driver launches.
      - name: Install the system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget \
            webkit2gtk-driver \
            xauth \
            xvfb
          pkg-config --exists webkit2gtk-4.1
          command -v WebKitWebDriver

      - name: Install the pinned toolchain
        run: rustup show active-toolchain
        working-directory: src-tauri

      # Swatinem/rust-cache v2.9.2. Also caches ~/.cargo/bin, so the driver
      # below is compiled only on a cache miss.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          key: real-app

      # oven-sh/setup-bun v2. The version is read from .bun-version.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      # The Tauri project's own WebDriver server. The version is pinned and
      # `--locked` uses the crate's own lockfile.
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked
        working-directory: src-tauri

      - name: Build the debug applications
        run: bun run build:e2e

      # `xvfb-run -a` picks a free display number. Every journey makes its own
      # private session bus and throwaway HOME, so nothing here needs a desktop.
      - name: Real-app tests
        run: xvfb-run -a bun run test:e2e

      # actions/upload-artifact v7.0.1. Logs include the application's own
      # output, which is what explains a failed start.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: real-app-results
          path: test-results/e2e
          if-no-files-found: warn
          retention-days: 14

  real-app-windows:
    name: Real app (Windows)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # src-tauri/rust-toolchain.toml pins the compiler and components.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
        working-directory: src-tauri

      # Swatinem/rust-cache v2.9.2.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          key: real-app-windows

      # oven-sh/setup-bun v2. The version is read from .bun-version.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      # This pinned installer matches WebDriver to WebView2, not to Edge.
      - name: Install matching WebView2 driver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          if (-not (Test-Path .\msedgedriver.exe)) {
            throw "Microsoft Edge WebDriver was not downloaded"
          }
          & .\msedgedriver.exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Edge WebDriver did not start"
          }
          $PWD.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        working-directory: src-tauri

      # The Tauri project's WebDriver server. The version is pinned and
      # `--locked` uses the crate's own lockfile.
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked
        working-directory: src-tauri

      - name: Build the debug applications
        run: bun run build:e2e

      # Exercise browser handover and export containment on Windows. The browser
      # probe uses a throwaway per-user HTTPS recorder and prints a skip reason
      # if it cannot establish that recorder as the effective handler. It never
      # launches the real browser and removes any registration it installs.
      - name: Browser handover and export containment
        run: cargo test --locked -p quota-desktop --lib --test browser_launch -- --show-output
        working-directory: src-tauri

      - name: Real-app tests
        run: bun run test:e2e

      # actions/upload-artifact v7.0.1. Keep Windows logs and screenshots too.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: real-app-windows-results
          path: test-results/e2e
          if-no-files-found: warn
          retention-days: 14
