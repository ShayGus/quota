# Scheduled dependency and advisory checks for Quota.
#
# This workflow changes nothing. It reports, so a reviewer can decide. Every
# `uses:` is pinned to a full 40-character commit SHA; see ci.yml for why.
#
# `cargo deny` reads src-tauri/deny.toml, which holds the advisory policy, the
# approved licence set, the allowed registry, and the duplicate-version policy.
# Its advisory check reads the RustSec database for the packages the shipped
# targets actually compile. `cargo audit` is deliberately not run: it reports
# every Cargo.lock entry, including optional packages no build compiles, so it
# fails on advisories Quota cannot be affected by, and the only way to quiet it
# is an ignore that would also hide the advisory if the package were ever built.
#
# `cargo outdated` is deliberately not installed here. No pinned action ships
# it, and `cargo install cargo-outdated` would compile an unpinned tool on every
# run. `cargo update --workspace --dry-run` is used instead: it lists the
# in-range upgrades Cargo can already take. A breaking upgrade is reviewed by
# hand in a pull request, which is where it belongs.

name: Dependencies

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  advisories:
    name: Advisories and licences
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        # The Cargo workspace, with its lockfile and deny.toml, is src-tauri.
        working-directory: src-tauri
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # src-tauri/rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      # EmbarkStudios/cargo-deny-action v2.1.1
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          manifest-path: src-tauri/Cargo.toml
          # `--locked` refuses to change Cargo.lock, so the gate reports on the
          # committed graph rather than an opportunistic update.
          arguments: --locked
          command-arguments: advisories licenses sources

      - name: Report in-range updates
        run: cargo update --workspace --dry-run
