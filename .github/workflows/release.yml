# Manual release: one button, one draft release, nothing public until you say so.
#
# Every `uses:` is pinned to a full 40-character commit SHA; see ci.yml for why.
# The only credential is the automatic `GITHUB_TOKEN`. The draft job is the only
# job that may write, and it writes nothing until both builds have succeeded.
#
# docs/RELEASING.md is the guide this workflow implements.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, three numbers such as 0.1.0. It must be the version in src-tauri/tauri.conf.json."
        required: true
        type: string

# Read-only by default. The draft job raises this for itself alone.
permissions:
  contents: read

# One run per version. A second run of the same version waits instead of racing
# the first one onto the same tag.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: The run starts from the default branch
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "a release is cut from main, not from $REF" >&2
          exit 1

      # The version reaches the script as an environment variable, never as
      # text inside the command, so it cannot become a command of its own.
      - name: The version is three numbers
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "the version must be three numbers, such as 0.1.0, not: $VERSION" >&2
            exit 1
          fi

      - name: The version is the one the application declares
        env:
          VERSION: ${{ inputs.version }}
        run: |
          configured="$(jq -r '.version' src-tauri/tauri.conf.json)"
          if [ "$configured" != "$VERSION" ]; then
            echo "the Tauri configuration declares $configured, not $VERSION" >&2
            exit 1
          fi

      - name: The tag does not exist yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            echo "tag v$VERSION already exists; a published release is never replaced" >&2
            exit 1
          fi

      # Asks about the CI workflow itself, by file name. A check-run query would
      # count this release run's own check, which is still running, and refuse
      # every release.
      - name: The commit passed the normal checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          runs="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&per_page=100" \
            --jq '.workflow_runs[] | "\(.status) \(.conclusion)"')"
          if [ -z "$runs" ]; then
            echo "the normal CI has never run on $COMMIT" >&2
            exit 1
          fi
          if printf '%s\n' "$runs" | grep -qv ' completed success$'; then
            printf '%s\n' "$runs" >&2
            echo "every CI run on the commit must have completed successfully" >&2
            exit 1
          fi

  checks:
    name: Safety checks
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        # Every Rust package, the lockfile, and the Cargo configuration live in
        # the Cargo workspace under src-tauri.
        working-directory: src-tauri
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The same development packages ci.yml installs. Tauri builds against the
      # system WebView, so a runner without them cannot compile the host.
      - name: Install the Tauri system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget
          pkg-config --exists webkit2gtk-4.1

      # src-tauri/rust-toolchain.toml pins the compiler, and rustup installs it
      # on first use. No step in this workflow repeats the version.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      # The gates and the tests run again on the exact commit that is released,
      # with no release secret in the runner. The frontend checks are not
      # repeated: preflight has already refused any commit whose CI did not
      # pass, and both builds run the frontend build themselves.
      - name: Release gate
        run: cargo xtask check-release

      - name: Architecture gate
        run: cargo xtask check-architecture

      - name: Generated binding drift
        run: cargo xtask bindings --check

      - name: Test
        run: cargo test --workspace --locked

  windows:
    name: Windows x64 packages
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      # oven-sh/setup-bun v2. The version is read from .bun-version, so the
      # file stays the one place the Bun release is pinned.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      # The NSIS installer installs for the current user and needs no
      # administrator rights; see bundle.windows.nsis in tauri.conf.json.
      - name: Build the installer and the MSI
        run: bun tauri build --bundles nsis,msi -- --locked

      - name: Collect the Windows packages
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release/

      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-packages
          path: release/
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x64 packages
    needs: checks
    # Ubuntu 22.04 is pinned on purpose. It is the oldest supported base that
    # ships WebKitGTK 4.1, so the packages run on more distributions than a
    # build from 24.04 would. A runner image upgrade needs a review.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The same development packages ci.yml installs. The AppImage also needs
      # `file`, `patchelf`, and `wget` to assemble its runtime.
      - name: Install the Tauri system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget
          pkg-config --exists webkit2gtk-4.1

      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      # oven-sh/setup-bun v2.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build the AppImage, the deb, and the rpm
        run: bun tauri build --bundles appimage,deb,rpm -- --locked

      - name: Collect the Linux packages
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/appimage/*.AppImage release/
          cp src-tauri/target/release/bundle/deb/*.deb release/
          cp src-tauri/target/release/bundle/rpm/*.rpm release/

      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-packages
          path: release/
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Draft release
    # Both builds must have succeeded, or nothing is created at all.
    needs: [checks, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The one job that writes: it creates the tag and the draft release.
    permissions:
      contents: write
    steps:
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: "*-packages"
          merge-multiple: true
          path: release

      - name: Checksums
        working-directory: release
        run: sha256sum ./*.exe ./*.msi ./*.AppImage ./*.deb ./*.rpm > SHA256SUMS

      - name: Release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "Quota $VERSION."
            echo
            echo "Windows: the installer (no administrator rights needed) and the MSI."
            echo "Linux: the AppImage, the deb, and the rpm."
            echo
            echo "Check a download against SHA256SUMS before you run it."
          } > release/NOTES.md

      - name: Create the draft release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --draft \
            --target "$COMMIT" \
            --title "Quota $VERSION" \
            --notes-file NOTES.md \
            ./*.exe ./*.msi ./*.AppImage ./*.deb ./*.rpm SHA256SUMS
