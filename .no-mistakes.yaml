# Per-repository no-mistakes configuration for Quota.
#
# The pipeline runs the project's own gates. The command strings below are the
# commands .github/workflows/ci.yml runs as `run:` gate steps, in CI's order and
# with CI's flags, so a validation run proves what CI proves. CI's one extra
# step, `cargo build --locked -p quota-desktop`, needs the test agent's launch
# check instead. README.md "Commands" and CONTRIBUTING.md section 3 own those
# lists: change this file in the same commit that changes them. Nothing here
# weakens a gate.

commands:
  # The static gates. No command is dropped, replaced, or made advisory.
  lint: >-
    cargo fmt --all -- --check &&
    cargo clippy --workspace --all-targets --locked -- -D warnings &&
    RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked &&
    cargo xtask check-architecture &&
    cargo xtask check-release &&
    cargo xtask bindings --check &&
    bun run typecheck &&
    bun run lint &&
    bun run format:check

  # The gates that execute code.
  test: >-
    cargo test --workspace --locked &&
    bun run test &&
    bun run build

# The Test agent runs the gate list. Its budget problem is exploration, not
# test time: the whole list runs in about a minute on a warm tree, so the
# instructions spend their words on what not to do instead.
test:
  instructions: |
    Prove the repository's own gates. Do not explore the tree, do not invent
    extra checks, and do not read source files to decide what to run.

    Run exactly these commands, once each, from the repository root, in this
    order:

      cargo fmt --all -- --check
      cargo clippy --workspace --all-targets --locked -- -D warnings
      RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      cargo xtask check-architecture
      cargo xtask check-release
      cargo xtask bindings --check
      bun run typecheck
      bun run lint
      bun run format:check
      cargo test --workspace --locked
      bun run test
      bun run build

    Then run one real launch check. Start `bun tauri dev`, wait until its log
    shows the Vite dev server URL and the Tauri host initialising with no
    panic, request the dev server URL and record the HTTP status, then stop
    it. This host has no window capture, so the log line and the HTTP response
    are the evidence; report them as such instead of claiming a screenshot.

    Reuse the warm `target/` directory and the installed `node_modules`. Never
    run `cargo clean`, delete `target/`, point `CARGO_TARGET_DIR` somewhere
    new, or rebuild from scratch. Install nothing: `bun install`,
    `cargo install`, and `cargo deny` are out of scope because the
    dependencies are already present. CONTRIBUTING.md "Measured times" holds
    the warm baseline for every command; a command far above its baseline
    means the build cache was lost, not that the code is slow.

    Run each command once and report the exact command, its exit code, and its
    wall-clock time. A failure is reported, not retried, not worked around, and
    not fixed: record it and stop.

# Quota does document where each fact belongs, so the Document step gets a
# pointer to those owners instead of a second prose policy of its own.
document:
  instructions: |
    README.md "Documentation" owns which file documents what, and
    CONTRIBUTING.md sections 7 and 8 own the enforced rules. Put a fact in the
    file that already owns it. Record every deviation in `docs/exceptions.md`
    with an owner, a rationale, a scope, a review date, and a removal
    condition. When a gate command is added, removed, or changed, update
    README.md "Commands" and CONTRIBUTING.md section 3 in the same commit.
