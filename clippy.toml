cognitive-complexity-threshold = 15
too-many-lines-threshold = 80
too-many-arguments-threshold = 6
type-complexity-threshold = 200
allow-expect-in-tests = true
# Deviation from the specification's example, recorded in docs/exceptions.md:
# test fixtures are built with `unwrap` for readability. Production code keeps
# `unwrap_used = "deny"`, so no shipped path can panic this way.
allow-unwrap-in-tests = true
allow-panic-in-tests = true