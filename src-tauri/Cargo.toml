[package]
name = "quota-desktop"
description = "Tauri desktop host for Quota: composition, typed IPC, and OS adapters."
version = "0.1.7"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
default-run = "quota"

[lib]
name = "quota_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quota"
path = "src/main.rs"

# The real-app test launcher; see the file. Absent from every build that does
# not select `sample-data`.
[[example]]
name = "quota_e2e"
path = "examples/quota_e2e.rs"
required-features = ["sample-data"]

[build-dependencies]
tauri-build = { workspace = true }

[features]
# Development-only agent inspection: screenshots, the DOM, the console log, and
# IPC traffic, over a Unix socket an AI agent connects to. It is a non-default
# feature, so ordinary `cargo build --release`, `cargo test`, and clippy do not
# compile the plugin or its native screenshot library. Cargo does not support
# `cfg(debug_assertions)` for selecting a dependency, so the build profile
# cannot do this job; `bootstrap.rs` still refuses to register the plugin
# unless `debug_assertions` is also set, and `cargo xtask check-release` fails
# if this feature or the plugin enters any release feature set.
agent-inspection = ["dep:tauri-plugin-mcp"]
# Loads the built renderer from `frontendDist` instead of the dev server URL.
# This is how the app is started locally; it is not a default feature.
custom-protocol = ["tauri/custom-protocol"]
# Seeds ten deterministic sample accounts and keeps their database and
# preference store under a `sample` subdirectory, so the overview can be
# reviewed with no real credentials. This is how the sample is started
# locally; it is not a default feature.
sample-data = ["quota-providers/test-fixtures"]

[dependencies]
quota-contracts = { workspace = true }
quota-core = { workspace = true }
quota-domain = { workspace = true }
quota-persistence = { workspace = true, features = ["tauri-plugins"] }
quota-providers = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
semver = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive"] }
specta-typescript = { workspace = true }
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-mcp = { workspace = true, optional = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-sql = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tungstenite = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true

[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90.0"
publish = false
license = "MIT"
repository = "https://github.com/ShayGus/quota"
homepage = "https://github.com/ShayGus/quota"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "warn"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
cognitive_complexity = "warn"
too_many_lines = "warn"
undocumented_unsafe_blocks = "deny"
used_underscore_binding = "deny"

# Panicking alternatives to `unwrap`/`expect`, from the recommended-lints gist.
# `indexing_slicing` and `string_slice` are the pair a sparse provider list
# would have tripped before it panicked.
indexing_slicing = "warn"
string_slice = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
# Silent failure. `let_underscore_must_use` and `map_err_ignore` are what let a
# swallowed connection error leave Connect broken with no message.
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"
# Resource, numeric, and diagnostic hygiene.
mem_forget = "warn"
rc_mutex = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
debug_assert_with_mut_call = "warn"
# A suppression is `#[expect(..., reason = "...")]` or nothing at all.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# The gist's "exit" section.
tests_outside_test_module = "warn"
error_impl_error = "warn"
or_fun_call = "warn"

[workspace.dependencies]
quota-contracts = { path = "crates/quota-contracts" }
async-trait = "0.1.92"
quota-core = { path = "crates/quota-core" }
quota-domain = { path = "crates/quota-domain" }
quota-persistence = { path = "crates/quota-persistence" }
quota-providers = { path = "crates/quota-providers" }

chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
proptest = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
semver = "=1.0.28"
serde_json = "1.0.151"
specta = "=2.0.0-rc.25"
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
sqlx = { version = "0.8.6", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
  "macros",
  "json",
  "uuid",
  "time",
] }
tauri = { version = "2.12.1", features = [] }
tauri-build = { version = "2.7.1", features = [] }
# Development-only agent inspection (screenshots, DOM, console logs, IPC). The
# member manifest makes it an optional dependency behind the non-default
# `agent-inspection` feature, so ordinary release builds do not compile or link
# it, and `cargo xtask check-release` fails if that ever stops being true. The pin is a
# full commit: a branch or tag can be moved after review.
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp", rev = "c7d271a06469bdf4744bfdeadca7458a1f3d02e5" }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-notification = "2.5.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.1"
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
tauri-plugin-store = "2.5.0"
tauri-plugin-updater = "=2.13.1"
tauri-plugin-window-state = "2.5.0"
tauri-specta = "=2.0.0-rc.25"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
# The local DevTools connection to the browser window a website sign-in opens.
# Plain `ws://127.0.0.1` only, so no TLS feature.
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["serde", "v4"] }

# The dev profile is what CI and every local gate run. Line tables keep
# backtraces readable while dropping the bulk of the DWARF that made a cold
# desktop build write gigabytes. Third-party dependencies carry no debug info
# at all; they are never the thing being debugged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
panic = "unwind"
overflow-checks = true
