[package]
name = "quota-desktop"
description = "Tauri desktop host for Quota: composition, typed IPC, and OS adapters."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
default-run = "quota"

[lib]
name = "quota_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quota"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[features]
# Development-only agent inspection: screenshots, the DOM, the console log, and
# IPC traffic, over a Unix socket an AI agent connects to. It is a non-default
# feature, so `cargo build --release`, `cargo test`, and clippy never compile
# the plugin or its native screenshot library. Cargo does not support
# `cfg(debug_assertions)` for selecting a dependency, so the build profile
# cannot do this job; `bootstrap.rs` still refuses to register the plugin
# unless `debug_assertions` is also set, and `cargo xtask check-release` fails
# if this feature or the plugin enters any release feature set.
agent-inspection = ["dep:tauri-plugin-mcp"]
# Loads the built renderer from `frontendDist` instead of the dev server URL.
# This is how the app is started locally; it is not a default feature.
custom-protocol = ["tauri/custom-protocol"]
# Seeds ten deterministic sample accounts and keeps their database and
# preference store under a `sample` subdirectory, so the overview can be
# reviewed with no real credentials. This is how the sample is started
# locally; it is not a default feature.
sample-data = ["quota-providers/test-fixtures"]

[dependencies]
quota-contracts = { workspace = true }
quota-core = { workspace = true }
quota-domain = { workspace = true }
quota-persistence = { workspace = true, features = ["tauri-plugins"] }
quota-providers = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive"] }
specta-typescript = { workspace = true }
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-mcp = { workspace = true, optional = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-positioner = { workspace = true, features = ["tray-icon"] }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-sql = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { workspace = true }

[lints]
workspace = true
