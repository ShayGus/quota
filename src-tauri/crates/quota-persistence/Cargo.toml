[package]
name = "quota-persistence"
description = "Typed SQLite repositories and typed store preferences for Quota."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Wires the repositories onto the Tauri storage plugins. Release artifacts are
# built with this feature off so the plugin registry is never linked in by
# accident outside the audited desktop host.
tauri-plugins = ["dep:tauri", "dep:tauri-plugin-sql", "dep:tauri-plugin-store"]

[dependencies]
async-trait = { workspace = true }
quota-core = { workspace = true }
quota-domain = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tauri = { workspace = true, optional = true }
tauri-plugin-sql = { workspace = true, optional = true }
tauri-plugin-store = { workspace = true, optional = true }
tracing = { workspace = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
