[package]
name = "quota-providers"
description = "Isolated provider clients, decoders, and polling strategies for Quota."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Compiles the deterministic local provider used by automated tests. Release
# artifacts are built with this feature off, so no test adapter can serve data.
test-fixtures = []

[dependencies]
quota-core = { workspace = true }
quota-domain = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Reads the Cursor app's sign-in from its SQLite state store, read-only.
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
tracing = { workspace = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
# Signs Ollama requests with the Ed25519 key Ollama keeps, as its CLI does.
# Already in the graph as rustls's crypto provider.
ring = { version = "0.17.14", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# The operating system's credential store holds every credential Quota owns
# itself: one store crate per system, behind keyring-core's common entry API.
keyring-core = "1.0.0"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[dev-dependencies]
# The fixture adapter is a non-default feature, so the test profile selects it
# explicitly. A plain `cargo build` never sees this table, which is why a
# release artifact still contains no fixture code.
quota-providers = { path = ".", features = ["test-fixtures"] }

[lints]
workspace = true