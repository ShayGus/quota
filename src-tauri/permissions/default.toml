# Application-command permissions.
#
# Each command below is an allow-list entry. A command that is not named here
# is denied to every window, regardless of what a capability file contains.
# `xtask check-architecture` compares this list against the commands actually
# registered in the Tauri Specta registry, so a new command cannot ship with
# implicit all-window access.

[default]
description = "Commands the floating overview window may call."
permissions = [
  "allow-get-snapshot",
  "allow-list-provider-capabilities",
  "allow-refresh-accounts",
  "allow-set-monitoring-state",
  "allow-set-account-enabled",
  "allow-rename-account",
  "allow-disconnect-account",
  "allow-open-provider-usage-page",
  "allow-set-indicator-style",
  "allow-set-overview-mode",
  "allow-set-overview-always-on-top",
  "allow-export-sanitized-diagnostics",
]